# ==============================================================================
# ccPerturbSeq Analysis Pipeline Configuration
# ==============================================================================
# This file contains all configurable parameters for the custom gRNA + GEX
# analysis pipeline. Edit the values below to match your experiment.
#
# Usage: All scripts in the pipeline read this configuration file.
#        python scripts/<script_name>.py --config config.yaml
# ==============================================================================

# --- Project ---
# Name of this analysis run (used in output directory names and reports)
analysis_name: "CSM_ccperturbseq"

# --- Environment ---
# Conda configuration for HPC job scripts
environment:
  # Path to conda installation (parent of condabin/)
  # Run `conda info --base` in your terminal to find this path if unsure.
  conda_prefix: "/medpop/rgupta/Jiahao/conda/envs/splitpipe-share"
  # Conda environment name or absolute prefix to activate for pipeline scripts
  conda_env: "/medpop/rgupta/Jiahao/conda/envs/splitpipe-share"

# --- Optional UGER resources (omit this entire section for legacy defaults) ---
# Memory is PER SLOT; total reserved GB = slots * memory_per_slot_gb.
# Every stage, reference build and QC profile is documented in docs/UGER_RESOURCES.md.
uger:
  queue: broad
  parallel_environment: smp
  binding: linear
  # os: RedHat8          # Optional site constraint; omitted for legacy pipeline jobs.
  # project: lab_account # Optional UGER accounting project (-P).
  # defaults:
  #   max_concurrent: 2  # Array tasks at once, independent for each stage.
  step1a: {slots: 16, memory_per_slot_gb: 8, runtime_hours: 48}
  step1b: {slots: 4, memory_per_slot_gb: 16, runtime_hours: 4}
  step1c: {slots: 1, memory_per_slot_gb: 4, runtime_hours: 12}
  step1c_aggregate: {slots: 4, memory_per_slot_gb: 32, runtime_hours: 8}
  step2: {slots: 1, memory_per_slot_gb: 4, runtime_hours: 12}
  step3: {slots: 8, memory_per_slot_gb: 4, runtime_hours: 12}
  step4: {slots: 4, memory_per_slot_gb: 32, runtime_hours: 4}
  step5: {slots: 1, memory_per_slot_gb: 32, runtime_hours: 4}

# --- Paths ---
paths:
  # Root directory where the pipeline lives
  project_dir: "/medpop/rgupta/Jiahao/TIMI/CSM_ccperturbseq"
  # Directory containing all raw FASTQ files
  fastq_dir: "/medpop/rgupta/Jiahao/TIMI/CSM_ccperturbseq/fastq"
  # Path to the split-pipe installation
  splitpipe_dir: "/medpop/rgupta/Jiahao/TIMI/CSM_ccperturbseq/ParseBiosciences-Pipeline.1.6.4"
  # STAR genome reference directory (pre-built via split-pipe --mode mkref)
  genome_dir: "/medpop/rgupta/Jiahao/reference_genome/parse_refdata-gex-GRCh38-2024-A/"
  # Output root directory for all pipeline results
  output_dir: "/medpop/rgupta/Jiahao/TIMI/CSM_ccperturbseq/output"
  # Directory for UGER job logs. Created automatically if it does not exist.
  log_dir: "/medpop/rgupta/Jiahao/logs/CSM_ccperturbseq/"
  # Path to the gRNA+iBAR reference lookup table (CSV).
  # *** This is the primary input required by Steps 3–5. ***
  # You can either:
  #   (a) Provide it directly (see references/example_grna_ibar_reference.csv for format)
  #   (b) Generate it from a design file by running Step 0:
  #       python scripts/00_format_reference.py --config config.yaml
  grna_reference: "/medpop/rgupta/Jiahao/TIMI/CSM_ccperturbseq/references/grna_ibar_reference.csv"

# --- Design File (optional — only for Step 0) ---
# Only used when you explicitly run Step 0 (00_format_reference.py) to generate
# grna_reference from a dual-guide library design file. Steps 1–5 do NOT read
# design_file — they only need grna_reference above.
#
# The design file must be in the CSV format produced by the CROPseq-multi (CSM)
# package (https://github.com/rtwalton/CROPseq-multi). Each row of the design
# file represents one dual-guide construct (pos1 + pos2).
design:
  # Path to the CSM library design file (CSV).
  # Required columns (case-sensitive):
  #   spacer_1              - pos1 protospacer sequence (20–21 bp)
  #   spacer_2              - pos2 protospacer sequence (20–21 bp)
  #   iBAR_1                - pos1 internal barcode (7 bp, on oligo synthesis strand)
  #   iBAR_2                - pos2 internal barcode (7 bp, on oligo synthesis strand)
  #   target_pos1           - Metadata label for pos1 target category (e.g., "TP53")
  #   spacer_version_pos1   - Spacer version for pos1 (e.g., "v1")
  #   target_pos2           - Metadata label for pos2 target category
  #   spacer_version_pos2   - Spacer version for pos2
  #   target                - Dual-target combo name (e.g., "TP53_CDKN1A")
  #   target_version        - Version of the target combo
  #   spacer_1_target       - Individual gene target for spacer_1
  #   spacer_2_target       - Individual gene target for spacer_2
  # Optional columns: GI_pair, GI_version, GI_version_index, tRNA_version, dialout
  design_file: "/medpop/rgupta/Jiahao/TIMI/CSM_ccperturbseq/CSM_library_design.20251104-1147.csv"
  # Whether to reverse-complement iBAR sequences from the design file.
  # Set to true (default) because CSM design-file iBARs are specified on the
  # oligo synthesis strand, which is the REVERSE COMPLEMENT of the gRNA
  # sequencing read strand. The pipeline reads iBARs from R1 (read strand),
  # so they must be rev-comp'd to match.
  rev_comp_ibar: true

# --- GEX alignment backend (existing configurations default to STAR) ---
gex_alignment:
  backend: "star"  # Backend/tool settings: docs/GEX_COUNTING.md
  gene_assignment: "unique"  # unique or fractional; applies to STAR and kallisto
  # umi_correction: "parse"  # parse (default), directional, none; applies to STAR and kallisto

# --- Parse Biosciences split-pipe settings ---
splitpipe:
  # Kit name. Options: WT, WT_mega, WT_mini
  # Run `split-pipe --kit_list` for available kits.
  kit: "WT"
  # Chemistry version. Options: v1, v2, v3
  chemistry: "v3"
  # Well range for sample assignment (e.g., "A1-A12", "A1-B12")
  sample_wells: "A1-B12"
  # Compatibility field retained for older configs. Production UGER Step 1a uses
  # uger.step1a.slots and passes the allocated NSLOTS to split-pipe.
  threads: 16
  # Memory limit in GB for split-pipe
  memory_gb: 64
  # Skip kit score check (--kit_score_skip). Set to true to bypass kit
  # score restrictions that can cause failures on some sublibraries.
  bypass_kit_score: true

# --- v1.4: GEX gRNA cross-contamination removal ---
# Universal RT uses both poly(A) and gRNA probes; this removes the small amount
# of short gRNA product that escapes the later GEX/gRNA size selection.
# Filter-negative reads with a full/fuzzy TSO are trimmed at that detected
# endpoint; reads without a full TSO retain Parse's exact-17-mer fallback.
gex_decontamination:
  enabled: true
  integration: "splitpipe_pre_router"
  tso_max_edit_dist: 3
  max_tso_start: 2
  tso_matching:
    backend: "edlib"
  filter_matching:
    backend: "packed_inline"
    guide_distance: "hamming"
    max_guide_mismatches: 1
    allow_guide_indels: false
    full_guide_required: true
    remove_reference_supported_ambiguous_hits: true
  io:
    write_rejected_raw_pairs: true
    keep_rejected_raw_pairs_after_step1c: true
    write_read_decisions: false
  step1c:
    enabled: false
    output_namespace: "gex_grna_identity"
    strict_matching:
      enabled: true
      max_guide_edit_distance: 1
      max_ibar_edit_distance: 1
      require_resolved_ibar_in_dual_mode: true
      reject_ibar_decoupled: true
  combine_with_grna_arm:
    enabled: false
    combine_before_umi_collapse: true
    retain_source_provenance: true
  existing_alignment:
    enabled: false
    policy: "auto_sandbox"
    source_output_dir_template: "{output_dir}/gex_{library}"
    sandbox_output_dir_template: "{output_dir}/gex_{library}_v1_4"
    bam_backend: "auto"
  require_qc_policy: false
  qc_policy_file: "references/gex_grna_filter_policy.yaml"

# --- Library Definitions ---
# The pipeline dynamically scales its array jobs based on the number of entries
# in this list. You can flexibly add or remove sublibraries.
# Each entry maps a GEX sublibrary to its paired gRNA sublibrary.
# sublibrary_name: Arbitrary label for this pair (e.g., C1, C2).
# gex_prefix: FASTQ prefix for the GEX library. Used as a keyword/glob search. 
#             The pipeline executes: find fastq_dir/ -name "*{gex_prefix}*_R1_*fastq.gz"
#             Test your prefix with this command to ensure it matches your files!
# grna_prefix: FASTQ prefix for the gRNA library. 
#              Tested the same way: find fastq_dir/ -name "*{grna_prefix}*_R1_*.fastq.gz"
# sample_name: Biological sample name for metadata annotation. Sublibraries 
#              sharing a sample_name will be merged.
libraries:
  - sublibrary_name: "C1"
    gex_prefix: "CSMC1"
    grna_prefix: "CSMS12_C1"
    sample_name: "Control"
  - sublibrary_name: "C2"
    gex_prefix: "CSMC2"
    grna_prefix: "CSMS12_C2"
    sample_name: "Control"
  - sublibrary_name: "T1"
    gex_prefix: "CSMT1"
    grna_prefix: "CSMS12_T1"
    sample_name: "Treatment"
  - sublibrary_name: "T2"
    gex_prefix: "CSMT2"
    grna_prefix: "CSMS12_T2"
    sample_name: "Treatment"

# --- gRNA Read 1 Structure ---
# CROPseq-multi (CSM) construct layout (5' → 3' on the cassette):
#
#   ...U6..tRNA..{Split_TSO}{gRNA}{stem}{iBAR}{tracrRNA}...terminator
#
# Parse Biosciences R1 reads from the Split_TSO into the insert, so R1 is:
#
#   ┌──────────────────────────────────────────────────────────────────┐
#   │ Split_TSO (30bp)│gRNA (20-21bp)│ stem (19bp) │iBAR (7bp)│tracr │
#   │ AAGCAGTGGTATCAA │ <variable>   │ GTTTGAGAG.. │ <7bp>    │ GACT │
#   │ CGCAGAGTGAATGGG │              │  or         │          │  or  │
#   │                 │              │ GTTTCAGAG.. │          │ AACA │
#   └──────────────────────────────────────────────────────────────────┘
#
# Two backbone variants (always paired):
#   Variant A: CSM_stem_1 + CSM_partial_tracr_1 (same guide cassette)
#   Variant B: CSM_stem_2 + CSM_partial_tracr_2 (same guide cassette)
#
# In the dual-guide construct, spacer_1 uses variant A and spacer_2
# uses variant B. R1 may capture either depending on which guide
# the Split_TSO landed on.
#
# Anchoring strategy:
#   1. Find Split_TSO at the start of R1 (tolerating mismatches)
#   2. The gRNA starts immediately after the TSO
#   3. After gRNA, find CSM_stem_1 or CSM_stem_2 to determine variant
#   4. The iBAR is immediately after the stem
#   5. Optionally verify partial_tracr after iBAR for confidence
#
# Mismatches in fixed sequences do NOT affect gRNA/iBAR assignment —
# they are only used as positional anchors.
grna_structure:
  # Whether to use single-guide mode. If true, skips reading/enforcing stem-specific fixed_seq_3 and fixed_seq_5.
  single_guide_mode: false
  # Split_TSO: universal anchor at the start of R1 (Parse template-switching oligo)
  fixed_seq_1: "AAGCAGTGGTATCAACGCAGAGTGAATGGG"
  # CSM_stem_1: variant A scaffold between gRNA and iBAR (19bp)
  fixed_seq_2: "GTTTGAGAGCTAAGCAGGA"
  # CSM_stem_2: variant B scaffold between gRNA and iBAR (19bp)
  fixed_seq_3: "GTTTCAGAGCTATGCTGGA"
  # CSM_partial_tracr_1: variant A tracrRNA downstream of iBAR (pairs with stem_1)
  fixed_seq_4: "GACTGCTTAGCAAGTT"
  # CSM_partial_tracr_2: variant B tracrRNA downstream of iBAR (pairs with stem_2)
  fixed_seq_5: "AACAGCATAGCAAGTT"
  # Expected gRNA lengths (list of possible lengths)
  # Default: [20, 21] for variable-length gRNA designs
  grna_lengths: [20, 21]
  # Expected iBAR length (fixed)
  ibar_length: 7
  # Maximum edit distance for finding Split_TSO in R1 (semi-global alignment).
  # Dedicated gRNA: circularization-capture amplification adds a random N7
  # between the sequencing-primer/index side of the molecule and the TSO, so
  # intact TSO starts at R1 offset 7. GEX size-selection carry-over lacks N7.
  # i7/i5 remain separate index reads; no additional N3 R1 prefix is assumed.
  # GEX-derived guide
  # reads start at offset 0; v1.4 separately tolerates offsets 1-2 for rare 5'
  # damage/sequencing error.
  # Higher values tolerate more sequencing errors but may find false TSOs.
  tso_max_edit_dist: 3
  # Maximum allowed COMBINED Hamming mismatches for stem+tracr anchor verification.
  # This is the TOTAL of stem_mm + tracr_mm for the correct pair (stem1+tracr1 or
  # stem2+tracr2). Used to determine which variant (pos1/pos2) a read belongs to.
  #
  # For the current CSM backbone (stem Hamming=3, tracr Hamming=3, combined=6):
  #   Safe limit: <= floor((6-1)/2) = 2
  #   At max_mm=2: only the correct pair (0mm) passes; wrong pair (6mm) and
  #   cross-pairs (3mm) are both rejected. Setting >2 risks cross-recognition.
  fixed_seq_max_mismatches: 2

# --- gRNA/iBAR Matching ---
grna_matching:
  # Maximum Levenshtein (edit) distance for fuzzy matching of gRNA sequences
  # against the reference. If a match at this distance is not unique (i.e.,
  # multiple references within this distance), the distance is automatically
  # reduced for that guide until a unique match is found, or the read is
  # marked as ambiguous.
  # Default: 3. Set to 0 for exact matching only.
  max_lev_dist: 3
  # Maximum Levenshtein distance for iBAR matching (same logic as gRNA)
  max_lev_dist_ibar: 2
  # Whether to separately save reads that fail Step 3 matching (extraction failure,
  # ambiguous stems, no reference match, etc.) to a companion file alongside the
  # main match output. Each failed read is recorded with the reason for failure.
  # Output: grna_matches/<lib>_grna_failed.tsv.gz
  save_failed_reads: false

# --- Cell-Level gRNA Assignment ---
guide_assignment:
  # Whether to use counting logic for dual-guide pairs (grouping by pos1/pos2 and inferring half-detected).
  # Note: This controls the downstream UMI counting step.
  dual_guide_counting_mode: true
  # Minimum UMI threshold for calling a guide (or guide pair) as "present" in a cell.
  # In dual_guide_mode:
  #   - Complete pairs (both pos1 + pos2 detected): threshold is applied to the
  #     pair-level SUM, i.e. pos1_umi + pos2_umi >= threshold.
  #     Example: pos1=3 UMIs, pos2=3 UMIs → pair_sum=6 >= 5 → PASSES.
  #   - Half-detected pairs (only one position detected): threshold is applied
  #     to the single detected position's UMI count alone.
  #     Example: pos1=3 UMIs, pos2=not detected → 3 < 5 → FAILS.
  # In single-guide mode: threshold is applied per-guide (umi_count >= threshold).
  min_umi_threshold: 5
  # How to handle cells with multiple guides above threshold:
  #   "top": assign only the guide with highest UMI count
  #   "all": keep all guides (multiplet)
  #   "discard": discard cells with >1 guide
  # Default: "all"
  multiplet_strategy: "all"
  # Minimum fraction of total guide UMIs for a guide to be assigned.
  # Only used when multiplet_strategy is "top". For example, 0.8 means
  # the top guide must have ≥80% of total guide UMIs in that cell.
  # Set to 0 to always assign the top guide regardless of dominance.
  min_dominance_fraction: 0.0
  # Whether to include corrected iBAR in UMI dedup grouping.
  # When true: groups by (cell, guide, ibar_corrected, target)
  # When false: groups by (cell, guide, target) only
  umi_dedup_ibar: true
  # Max Hamming distance for UMI error correction (directional method).
  # 0 = exact UMI counting (no correction). 1 = collapse UMIs within 1bp.
  max_umi_edits: 1
  # Minimum number of reads required for a UMI to be considered valid.
  # UMIs with fewer reads are discarded before directional collapsing.
  # Set to 1 to keep all UMIs (default, backward-compatible).
  # Set to 2+ to require read-level confirmation of each molecule.
  min_reads_per_umi: 1
  # Whether to compute the sequencing saturation downsampling curve.
  # Subsamples reads at multiple depths to estimate how many additional
  # UMIs would be recovered with more sequencing.
  # Output: grna_assignment/saturation_curve.png
  compute_saturation_curve: true

# --- Barcode Extraction ---
barcode_extraction:
  # Maximum edit distance for Parse barcode correction (per round).
  # Default from split-pipe: 1
  bc_max_edit_dist: 1
  # Minimum R1 read length after trimming. Reads shorter than this are discarded.
  min_r1_length: 20
  # Minimum R2 read length. Reads shorter than this are discarded.
  min_r2_length: 50
  # Number of parallel processes for barcode extraction
  n_processes: 8
  # Maximum number of reads to process (0 = all reads).
  # Useful for testing with a small subset.
  max_reads: 0

# --- Output ---
output:
  # Whether to save intermediate files (barcode TSV, per-read gRNA matches)
  save_intermediates: true
  # Whether to generate QC plots
  generate_qc_plots: true
  # Format for the final combined output. Options: "h5ad", "loom"
  output_format: "h5ad"
