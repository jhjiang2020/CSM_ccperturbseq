# Overlay: merge this block into a complete pipeline configuration.
# Guide: docs/GRNA_RECOVERY_V2_1_EVIDENCE.md
# Set mode: auto to opt in; omit this block or use off for standard matching.
# Recommended first step: audit without changing assignments.
# auto enables experimental recovery after reference/pilot identity checks;
# the four-library biological benchmark does not establish a validated default.
grna_recovery:
  mode: audit
  tso:
    endpoint_policy: joint
    max_edit_distance: 3
    partial_tso: false
  spacer:
    max_5prime_loss: 3
    min_retained: auto
    min_quality: 30
    retained_edit_distance: 0
  ibar_corroboration: report
  pilot:
    sample_reads: 100000
    seed: 21
    split_by: cell_umi
    min_validation_families: 1000
    min_accuracy: 0.995
    near_optimal_fraction: 0.99
  resolved_contract: null
