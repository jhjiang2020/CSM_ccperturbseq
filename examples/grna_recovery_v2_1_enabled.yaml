# Full v2.1 opt-in: relaxed matching plus GEX-derived guide evidence in final calls.
# Merge these keys into a complete config; preserve its other settings.
# Guide and limitations: docs/GRNA_RECOVERY_V2_1_EVIDENCE.md
# For an assignment-preserving threshold audit, use grna_recovery_v2_1.yaml.
grna_recovery:
  mode: auto
  tso:
    endpoint_policy: joint
    max_edit_distance: 3
    partial_tso: false
  spacer:
    max_5prime_loss: 3
    min_retained: auto
    min_quality: 30
    retained_edit_distance: 0
  ibar_corroboration: report
  pilot:
    sample_reads: 100000
    seed: 21
    split_by: cell_umi
    min_validation_families: 1000
    min_accuracy: 0.995
    near_optimal_fraction: 0.99
  resolved_contract: null

# Future runs: the standard GEX filter collects corrected-barcode guide evidence.
# These two identity/merge switches are separate from GEX read removal.
gex_decontamination:
  enabled: true
  step1c:
    enabled: true
    output_namespace: gex_grna_identity
    strict_matching:
      enabled: true
      max_guide_edit_distance: 1
      max_ibar_edit_distance: 1
      require_resolved_ibar_in_dual_mode: true
      reject_ibar_decoupled: true
  combine_with_grna_arm:
    enabled: true
    combine_before_umi_collapse: true
    retain_source_provenance: true
